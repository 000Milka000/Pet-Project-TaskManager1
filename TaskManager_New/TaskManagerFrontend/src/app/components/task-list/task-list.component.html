<div class = "container">
    <h1>Список задач</h1>

    <div class = "allTasks">
        <h3>Все задачи</h3>

        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" (change)="selectAllTasks($event)"></th>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Описание</th>
                </tr>
            </thead>
        </table>
    </div>

    <div class="myTasks">
        <h3>Мои задачи</h3>
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" (change)="selectAllMyTasks($event)"></th>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let task of myTasks">
                    <td>
                        <input 
                            type="checkbox"
                            [checked]="task.selected"
                            (change)="toggleMyTaskSelection(task)"
                            >
                    </td>
                    <td>{{ task.id }}</td>
                    <td>{{ task.title }}</td>
                    <td>{{ task.description }}</td>
                    <td>
                        <button class="deleteTask" (click)="deleteTask(task.title, task.userId)">
                            Удалить
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="newTask" (click)="newTask()">Создать новую задачу</button>
    <div *ngIf="isLoading" class = "loading">Загрузка...</div>
</div>
